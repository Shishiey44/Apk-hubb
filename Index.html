<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Hub Pro</title>
    <style>
        /* Modern CSS with all features */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --secondary-dark: #059669;
            --error: #ef4444;
            --error-dark: #dc2626;
            --warning: #f59e0b;
            --info: #3b82f6;
            --text-light: #f8fafc;
            --text-dark: #1e293b;
            --bg-light: #ffffff;
            --bg-dark: #0f172a;
            --gray-light: #f1f5f9;
            --gray-medium: #94a3b8;
            --gray-dark: #475569;
            --radius: 0.5rem;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --transition: all 0.2s ease;
        }

        /* Dark mode */
        .dark-mode {
            --text-light: #1e293b;
            --text-dark: #f8fafc;
            --bg-light: #0f172a;
            --bg-dark: #f8fafc;
            --gray-light: #1e293b;
            --gray-medium: #475569;
            --gray-dark: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        /* Header styles */
        header {
            background: var(--primary);
            color: var(--text-light);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Navigation */
        nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
            padding: 0.5rem 0;
            position: relative;
        }

        nav a:hover {
            opacity: 0.9;
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--text-light);
        }

        /* Main content */
        main {
            padding: 2rem;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Footer */
        footer {
            background: var(--gray-light);
            color: var(--text-dark);
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
        }

        /* Buttons */
        button, .btn {
            background: var(--primary);
            color: var(--text-light);
            border: none;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            border-radius: var(--radius);
            transition: var(--transition);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover, .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* Button variants */
        .btn-secondary {
            background: var(--gray-light);
            color: var(--text-dark);
        }

        .btn-success {
            background: var(--secondary);
        }

        .btn-danger {
            background: var(--error);
        }

        /* Homepage styles */
        .hero {
            text-align: center;
            padding: 3rem 0;
            margin-bottom: 2rem;
        }

        /* Search and filter */
        .discovery-tools {
            background: var(--gray-light);
            padding: 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        /* App grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* App card */
        .app-card {
            background: var(--bg-light);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--gray-light);
        }

        /* Form styles */
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-light);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* Auth forms */
        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            background: var(--bg-light);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* Admin dashboard */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .discovery-tools {
                grid-template-columns: 1fr;
            }
            
            .app-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-card {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div id="app-container"></div>

    <script>
        // Enhanced Database
        const DB = {
            users: [
                { id: 1, username: "admin", password: "admin123", role: "admin" },
                { id: 2, username: "dev1", password: "dev123", role: "developer" }
            ],
            apps: [
                {
                    id: 1,
                    name: "Weather Pro",
                    developerId: 2,
                    description: "Accurate weather forecasts",
                    version: "1.0.0",
                    size: "12MB",
                    downloads: 1000,
                    approved: true,
                    categories: ["weather"]
                }
            ],
            pending: [],
            categories: ["weather", "productivity", "games"],
            currentUser: null
        };

        // Save/load from localStorage
        function saveDB() {
            localStorage.setItem('apkHubDB', JSON.stringify(DB));
        }

        function loadDB() {
            const savedDB = localStorage.getItem('apkHubDB');
            if (savedDB) Object.assign(DB, JSON.parse(savedDB));
        }

        // Initialize
        loadDB();

        // Router
        const routes = {
            '/': homePage,
            '/apps': appsPage,
            '/submit': submitPage,
            '/admin': adminPage,
            '/login': authPage,
            '/register': authPage
        };

        function navigate(path) {
            window.history.pushState({}, '', path);
            render();
        }

        function render() {
            const path = window.location.pathname;
            const routeHandler = routes[path] || homePage;
            document.getElementById('app-container').innerHTML = routeHandler();
            
            if (path === '/' || path === '/apps') initAppsPage();
            if (path === '/submit') initSubmitPage();
            if (path === '/admin') initAdminPage();
            if (path === '/login' || path === '/register') initAuthPage();
        }

        // Pages
        function homePage() {
            return `
                <header>
                    <h1>APK Hub Pro</h1>
                    <nav>
                        <a href="/" class="nav-link active">Home</a>
                        <a href="/apps" class="nav-link">Browse</a>
                        ${DB.currentUser ? `<a href="/submit" class="nav-link">Submit</a>` : ''}
                        ${DB.currentUser?.role === 'admin' ? `<a href="/admin" class="nav-link">Admin</a>` : ''}
                        ${DB.currentUser 
                            ? `<button id="logoutBtn">Logout</button>`
                            : `<a href="/login" class="nav-link">Login</a>`}
                    </nav>
                </header>
                <main>
                    <div class="hero">
                        <h1>Discover Amazing Apps</h1>
                        <p>Download APKs directly from developers</p>
                    </div>
                </main>
            `;
        }

        function appsPage() {
            return `
                <header>
                    <h1>APK Hub Pro</h1>
                    <nav>
                        <a href="/" class="nav-link">Home</a>
                        <a href="/apps" class="nav-link active">Browse</a>
                        ${DB.currentUser ? `<a href="/submit" class="nav-link">Submit</a>` : ''}
                        ${DB.currentUser?.role === 'admin' ? `<a href="/admin" class="nav-link">Admin</a>` : ''}
                        ${DB.currentUser 
                            ? `<button id="logoutBtn">Logout</button>`
                            : `<a href="/login" class="nav-link">Login</a>`}
                    </nav>
                </header>
                <main>
                    <div class="discovery-tools">
                        <div class="search-container">
                            <input type="text" placeholder="Search apps...">
                            <button>Search</button>
                        </div>
                        <select>
                            <option>All Categories</option>
                            ${DB.categories.map(c => `<option>${c}</option>`).join('')}
                        </select>
                    </div>
                    <div class="app-grid">
                        ${DB.apps.map(app => `
                            <div class="app-card">
                                <h3>${app.name}</h3>
                                <p>${app.description}</p>
                                <button class="download-btn">Download</button>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
        }

        function submitPage() {
            if (!DB.currentUser) navigate('/login');
            
            return `
                <header>
                    <h1>APK Hub Pro</h1>
                    <nav>
                        <a href="/" class="nav-link">Home</a>
                        <a href="/apps" class="nav-link">Browse</a>
                        <a href="/submit" class="nav-link active">Submit</a>
                        ${DB.currentUser?.role === 'admin' ? `<a href="/admin" class="nav-link">Admin</a>` : ''}
                        <button id="logoutBtn">Logout</button>
                    </nav>
                </header>
                <main>
                    <div class="form-container">
                        <h2>Submit Your App</h2>
                        <form id="appForm">
                            <input type="text" placeholder="App Name" required>
                            <textarea placeholder="Description" required></textarea>
                            <input type="file" accept=".apk" required>
                            <button type="submit" class="btn">Submit</button>
                        </form>
                    </div>
                </main>
            `;
        }

        function adminPage() {
            if (!DB.currentUser?.role === 'admin') navigate('/');
            
            return `
                <header>
                    <h1>APK Hub Pro - Admin</h1>
                    <nav>
                        <a href="/" class="nav-link">Home</a>
                        <a href="/apps" class="nav-link">Browse</a>
                        <a href="/submit" class="nav-link">Submit</a>
                        <a href="/admin" class="nav-link active">Admin</a>
                        <button id="logoutBtn">Logout</button>
                    </nav>
                </header>
                <main>
                    <div class="admin-container">
                        <h2>Pending Submissions</h2>
                        ${DB.pending.map(app => `
                            <div class="app-card">
                                <h3>${app.name}</h3>
                                <p>${app.description}</p>
                                <div class="actions">
                                    <button class="btn-success">Approve</button>
                                    <button class="btn-danger">Reject</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
        }

        function authPage() {
            const isLogin = window.location.pathname === '/login';
            
            return `
                <div class="auth-container">
                    <h2>${isLogin ? 'Login' : 'Register'}</h2>
                    <form id="authForm">
                        <input type="text" placeholder="Username" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit" class="btn">
                            ${isLogin ? 'Login' : 'Register'}
                        </button>
                    </form>
                    <p>${isLogin ? 'Need an account?' : 'Already have an account?'} 
                        <a href="${isLogin ? '/register' : '/login'}">
                            ${isLogin ? 'Register' : 'Login'}
                        </a>
                    </p>
                </div>
            `;
        }

        // Initialize pages
        function initAppsPage() {
            // Add event listeners for search, filter, download
        }

        function initSubmitPage() {
            document.getElementById('appForm')?.addEventListener('submit', function(e) {
                e.preventDefault();
                // Handle form submission
            });
        }

        function initAdminPage() {
            // Add admin functionality
        }

        function initAuthPage() {
            document.getElementById('authForm')?.addEventListener('submit', function(e) {
                e.preventDefault();
                // Handle authentication
            });
        }

        // Event listeners
        function handleNavigation() {
            document.addEventListener('click', function(e) {
                if (e.target.tagName === 'A' && e.target.href) {
                    e.preventDefault();
                    navigate(new URL(e.target.href).pathname);
                }
            });
            
            window.addEventListener('popstate', render);
        }

        // Initialize
        handleNavigation();
        render();
    </script>
</body>
  </html>
